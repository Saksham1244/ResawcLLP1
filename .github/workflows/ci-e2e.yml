name: CI / E2E & Visual Regression Testing

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Playwright Functional, Regression & Visual Testing
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'resawc_ci_secret_jwt_key_2026' }}
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install Dependencies
        working-directory: web-app
        run: npm ci

      - name: Generate Prisma Database Client
        working-directory: web-app
        run: npx prisma generate

      - name: Run TypeScript Type Check
        working-directory: web-app
        run: npx tsc --noEmit

      - name: Install Playwright Browsers & Dependencies
        working-directory: web-app
        run: npx playwright install --with-deps chromium

      - name: Build Production Next.js App
        working-directory: web-app
        run: npm run build

      - name: Run Playwright E2E Functional & Regression Tests
        working-directory: web-app
        run: npx playwright test e2e/auth.spec.ts e2e/dashboard.spec.ts e2e/production-finance.spec.ts

      - name: Run Percy / Visual Regression Tests
        working-directory: web-app
        run: |
          if [ -n "$PERCY_TOKEN" ]; then
            echo "Percy token detected. Executing Percy visual diff testing..."
            npx percy exec -- npx playwright test e2e/visual-regression.spec.ts
          else
            echo "No PERCY_TOKEN secret configured. Running local Playwright visual snapshots..."
            npx playwright test e2e/visual-regression.spec.ts
          fi

      - name: Upload Playwright Test Report & Visual Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-report
          path: web-app/playwright-report/
          retention-days: 14
